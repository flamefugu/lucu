  c.life.state = 'stretch'; c.life.lock = true; c.life.t0 = clock.elapsedTime; c.walk.active = false; setLines(c, [{ at: 0.4, text: T(c, 'stretch'), dur: 2.6 }]);
}
function lifeUpdate(c, t, dt) {
  const { needs, life, act, sl } = c, sp = dt * SPEED, asleep = life.state === 'sleep' || life.state === 'lie', R = c.p.rate;
  needs.hunger = Math.max(0, needs.hunger - R.hunger * sp * (asleep ? 0.3 : 1));
  needs.thirst = Math.max(0, needs.thirst - R.thirst * sp * (asleep ? 0.3 : 1));
  needs.energy = asleep ? Math.min(100, needs.energy + 1.6 * sp) : Math.max(0, needs.energy - R.energy * sp);
  life.lie += (life.lieT - life.lie) * (1 - Math.exp(-2.5 * dt));
  if (life.state !== 'eat') life.foodS += (1 - life.foodS) * dt * 0.04;
  if (life.state !== 'drink') life.waterS += (1 - life.waterS) * dt * 0.04;
  if (t > life.save) { life.save = t + 5 + Math.random(); try { localStorage.setItem('mmd-needs-' + c.name, JSON.stringify({ ...needs, ts: Date.now() })); } catch (e) {} }
  if (!lifeBox.checked) return;
  const S = life.state, s = t - life.t0, sp0 = life.spot;
  for (const e of c.lifeLines) if (!e.done && s >= e.at) { e.done = true; say(c, e.text, e.dur, false); }

  if (S === 'free') {
    if (sl.active || t < life.cool || t - c.auto.lastTouch < 4) return;
    for (const k in needs) if (needs[k] > HINT + 20) life.hinted[k] = false;
    const low = Object.keys(needs).filter(k => needs[k] < LOW).sort((x, y) => needs[x] - needs[y])[0];
    const busy = (sp) => sp.by && sp.by !== c, own = spots.beds[c.home], bed = own.by && own.by !== c ? spots.beds.find(b => !b.by) : own;
    if (low === 'hunger') { if (busy(spots.food)) { say(c, T(c, 'wait'), 2.5, false); life.cool = t + 8; } else { say(c, T(c, 'goHungry'), 2.5, false); goTo(c, 'toFood', spots.food); } }
    else if (low === 'thirst') { if (busy(spots.water)) { say(c, T(c, 'wait'), 2.5, false); life.cool = t + 8; } else { say(c, T(c, 'goThirsty'), 2.5, false); goTo(c, 'toWater', spots.water); } }
    else if (low === 'energy') { if (!bed) { say(c, T(c, 'wait'), 2.5, false); life.cool = t + 8; } else { say(c, T(c, 'goSleep'), 2.8, false); life.bed = bed; goTo(c, 'toBed', bed); } }
    else if (needs.energy < HINT && !life.hinted.energy) { life.hinted.energy = true; startSleepy(c); }
    else if (needs.hunger < HINT && !life.hinted.hunger) { life.hinted.hunger = true; say(c, T(c, 'hintHungry'), 3, false); }
    else if (needs.thirst < HINT && !life.hinted.thirst) { life.hinted.thirst = true; say(c, T(c, 'hintThirsty'), 3, false); }
    return;
  }
  if (S === 'toChat' || S === 'listen') return;   // diatur chatUpdate
  if (S === 'toFood' || S === 'toWater' || S === 'toBed') {
    if (c.walk.active) return;
    if (Math.hypot(sp0.x - c.mesh.position.x, sp0.z - c.mesh.position.z) < H * 0.2) {
      c.mesh.position.x = sp0.x; c.mesh.position.z = sp0.z; life.from = { x: sp0.x, z: sp0.z }; life.t0 = t;
      if (S === 'toBed') { life.state = 'lie'; life.bed = sp0; life.fromFace = sp0.face; life.lieT = 1; life.eyes = 1; setLines(c, [{ at: 0.2, text: T(c, 'sleepIn'), dur: 2.4 }]); }
      else if (S === 'toFood') { life.state = 'eat'; setLines(c, [{ at: 0.3, text: T(c, 'eatStart'), dur: 3.5 }, { at: 7.4, text: T(c, 'eatEnd'), dur: 2.2 }]); }
      else { life.state = 'drink'; setLines(c, [{ at: 0.3, text: T(c, 'drinkStart'), dur: 3 }, { at: 4.8, text: T(c, 'drinkEnd'), dur: 2 }]); }
    } else if (++life.tries > 3 || s > 40) lifeDone(c, t, 15);
    else walkTo(c, { x: sp0.x, z: sp0.z }, false, true, true);
    return;
  }
  if (S === 'eat') {
    faceTo(c, sp0.face, dt); act.kind = 'eat';
    const k = 0.5 - 0.5 * Math.cos(s * Math.PI * 2 / 1.7);
    act.u = k * ss(0.2, 0.9, s) * (1 - ss(7.4, 8.2, s)); act.nod = 0.12 * k * act.u;
    act.chew = k < 0.35 && s > 0.8 && s < 8 ? 0.2 + 0.2 * Math.abs(Math.sin(s * 12)) : 0;
    needs.hunger = Math.min(100, needs.hunger + dt * 80 / 9.5); life.foodS = Math.max(0.12, 1 - 0.88 * s / 8);
    if (s > 9.6) lifeDone(c, t, 8);
    return;
  }
  if (S === 'drink') {
    faceTo(c, sp0.face, dt); act.kind = 'drink';
    act.u = ss(0.4, 1.3, s) * (1 - ss(3.9, 4.8, s)); act.tilt = act.u; act.chew = act.u > 0.8 ? 0.15 * Math.abs(Math.sin(s * 9)) : 0;
    needs.thirst = Math.min(100, needs.thirst + dt * 80 / 6.8); life.waterS = Math.max(0.12, 1 - 0.85 * s / 4.5);
    if (s > 6.8) lifeDone(c, t, 8);
    return;
  }
  if (S === 'stretch') { act.kind = 'stretch'; act.u = ss(0, 1.2, s) * (1 - ss(2.8, 4, s)); if (s > 4) lifeDone(c, t, 10); return; }
  if (S === 'lie') { if (s > 2.6) { life.state = 'sleep'; life.t0 = t; life.zi = -1; } return; }
  if (S === 'sleep') {
    const zi = Math.floor(s / 2.6);
    if (zi !== life.zi) { life.zi = zi; say(c, 'z'.repeat(zi % 3 + 1) + '…', 2.3, false); }
    if (needs.energy >= 100) { life.state = 'wake'; life.t0 = t; life.lieT = 0; life.eyes = 0; startSleepy(c, true); }
    return;
  }
  if (S === 'wake' && !sl.active) { life.hinted = {}; lifeDone(c, t, 30); }
}

// ---------- Ngobrol antar karakter ----------
const chat = { on: false, a: null, b: null, phase: '', t0: 0, i: 0, next: 0, lines: [] };
let nextSocial = 15;
function endChat(t, cool, done) {
  [chat.a, chat.b].forEach(c => { if (c && c.mesh && (c.life.state === 'toChat' || c.life.state === 'listen')) { c.life.state = 'free'; c.life.lock = false; c.life.cool = t + 3; c.socialCool = t + cool; } });
  const A = chat.a, B = chat.b, k = chat.kind; chat.on = false;
  if (!done || !A || !B || !A.mesh || !B.mesh) return;
  if (k === 'fight') { setMood(A, 'angry', 50 + Math.random() * 30); setMood(B, Math.random() < B.p.temper + 0.25 ? 'angry' : 'sad', 50 + Math.random() * 30); addRel(A, B, -15); retreat(A); retreat(B); }
  else if (k === 'comfort') { setMood(B, 'happy', 25); setMood(A, 'calm', 0); addRel(A, B, 12); }
  else if (k === 'reconcile') { if (chat.ok) { setMood(A, 'happy', 30); setMood(B, 'happy', 30); addRel(A, B, 20); } else { setMood(A, 'sad', 40); addRel(A, B, -3); retreat(A); } }
  else addRel(A, B, 3);
}
function tryStartChat(t) {
  const el = chars.filter(c => c.mesh && c.life.state === 'free' && !c.sl.active && t > c.socialCool);
  if (el.length < 2) return;
  const total = el.reduce((s, c) => s + c.p.talk, 0); let r = Math.random() * total;
  const A = el.find(c => (r -= c.p.talk) < 0) || el[0], B = pick(el.filter(c => c !== A));
  const sleeper = chars.find(c => c !== A && c.life.state === 'sleep');
  if (sleeper && Math.random() < 0.5) { say(A, T(A, 'seeSleeper', sleeper)); A.socialCool = t + 25; return; }   // komentar untuk yang tidur
  const kind = pickKind(A, B); if (!kind) { A.socialCool = t + 15; return; }
  Object.assign(chat, { on: true, a: A, b: B, phase: 'walk', t0: t, i: 0, next: 0, lines: [], kind, ok: Math.random() < 0.45 + getRel(A, B) / 250 + B.p.kind * 0.25 });
  A.life.state = 'toChat'; B.life.state = 'listen'; A.life.lock = B.life.lock = true; A.walk.active = B.walk.active = false;
  const bp = B.mesh.position; let ax = A.mesh.position.x - bp.x, az = A.mesh.position.z - bp.z; const d = Math.hypot(ax, az) || 1; ax /= d; az /= d;
  for (let i = 0; i < 9; i++) {
    const ang = (i % 2 ? 1 : -1) * Math.ceil(i / 2) * 0.6, cs = Math.cos(ang), sn = Math.sin(ang);
    const x = bp.x + (ax * cs - az * sn) * H * 1.0, z = bp.z + (ax * sn + az * cs) * H * 1.0;
    if (!blocked(x, z)) { walkTo(A, { x, z }, false, true, true); return; }
  }
  endChat(t, 10);
}
function buildLines(A, B, kind) {
  const t = (c, k, o) => [c, T(c, k, o)];
  if (kind === 'fight') return [t(A, 'fightStart', B), t(B, 'fightReply', A), t(A, 'fight2', B), t(B, 'fightReply', A), t(A, 'fightEnd', B)];
  if (kind === 'comfort') return [t(A, 'comfortStart', B), t(B, 'sadReply', A), t(A, 'comfort', B), t(B, 'thanks', A), t(A, 'comfortEnd', B)];
  if (kind === 'reconcile') return chat.ok ? [t(A, 'apologize', B), t(B, 'forgive', A), t(A, 'relieved', B)] : [t(A, 'apologize', B), t(B, 'refuse', A), t(A, 'idleSad')];
  const L = [[A, T(A, 'chatStart', B)], [B, B.needs.energy < 40 ? T(B, 'sleepyReply', A) : T(B, 'reply', A)], [A, T(A, 'chat', B)], [B, T(B, 'reply2', A)]];
  if (Math.random() < 0.6) L.push([A, T(A, 'chat', B)], [B, T(B, 'reply', A)]);
  L.push([A, T(A, 'bye', B)]); return L;
}
// ---------- Hubungan & suasana hati ----------
const rels = {}, rk = (a, b) => [a.name, b.name].sort().join('|');
const getRel = (a, b) => rels[rk(a, b)] ?? 20, addRel = (a, b, d) => { rels[rk(a, b)] = Math.max(-100, Math.min(100, getRel(a, b) + d)); };
const ICON = { angry: ' 💢', sad: ' 💧', happy: ' 💕', calm: '' };
function setMood(c, type, secs) { c.mood.type = type; c.mood.until = clock.elapsedTime + secs; c.bubble.dataset.n = c.name + ICON[type]; }
function retreat(c) {   // pergi (cepat) ke kamarnya sendiri
  for (let i = 0; i < 10; i++) { const x = roomCx(c.home) + (Math.random() * 2 - 1) * (RW / 2 - H * 0.8), z = (Math.random() * 2 - 1) * (WZ - H * 0.8);
    if (!blocked(x, z)) { c.auto.lastTouch = -99; walkTo(c, { x, z }, true, true); return; } }
}
function pickKind(A, B) {
  const r = getRel(A, B), R = Math.random(), up = (c) => c.mood.type === 'angry' || c.mood.type === 'sad';
  if (up(A)) return A.mood.type === 'angry' && R > 0.35 + A.p.kind * 0.5 ? 'fight' : 'reconcile';
  if (B.mood.type === 'sad') return R < 0.4 + A.p.kind * 0.5 ? 'comfort' : '';
  if (B.mood.type === 'angry') return R < 0.3 + A.p.kind * 0.6 ? 'reconcile' : '';
  return R < A.p.temper * (0.5 - r / 200) ? 'fight' : 'chat';
}
const MOOD_MORPH = { angry: ['怒り'], sad: ['悲しい', '困る'], happy: ['にこり', '笑い'] };
function moodApply(c, t, dt) {
  const m = c.mood, mk = c.mk, k = 1 - Math.exp(-4 * dt);
  if (m.type !== 'calm' && t > m.until) setMood(c, 'calm', 0);
  for (const key in mk) { mk[key] += ((m.type === key ? 1 : 0) - mk[key]) * k;
    const idx = MOOD_MORPH[key].map(n => c.morph[n]).find(i => i !== undefined); if (idx !== undefined) c.mesh.morphTargetInfluences[idx] = mk[key] * 0.85; }
  const { upper, neck, head } = c.bones, A = mk.angry, S = mk.sad, Hp = mk.happy, g = 1 - Math.min(1, c.life.lie * 3);
  if (upper) { upper.rotation.x += (0.08 * A + 0.1 * S + Math.sin(t * 3) * 0.03 * Hp) * g; upper.rotation.z += Math.sin(t * 28) * 0.025 * A * g; }
  if (neck) neck.rotation.x += 0.15 * S * g;
  if (head) { head.rotation.x += (0.12 * A + 0.35 * S) * g; head.rotation.z += Math.sin(t * 2.2) * 0.06 * Hp * g; head.rotation.y += Math.sin(t * 25) * 0.03 * A * g; }
}
function camUpdate(dt) {
  if (selected && selected.mesh) { const x = selected.mesh.position.x; if (x < -8) camRoom = -1; else if (x > 8) camRoom = 1; }
  const want = camera.aspect < 1.2 ? camRoom * RW / 2 : 0, d = (want - camShift) * (1 - Math.exp(-3 * dt));
  camShift += d; controls.target.x += d; camera.position.x += d;
}
function chatUpdate(t, dt) {
  if (!chat.on) { if (lifeBox.checked && t > nextSocial) { nextSocial = t + 14 + Math.random() * 20; tryStartChat(t); } return; }
  const A = chat.a, B = chat.b;
  if (!A.mesh || !B.mesh || !lifeBox.checked) return endChat(t, 10);
  const ap = A.mesh.position, bp = B.mesh.position;
  faceTo(B, Math.atan2(ap.x - bp.x, ap.z - bp.z), dt);
  if (chat.phase === 'walk') {
    if (A.walk.active) return;
    if (Math.hypot(ap.x - bp.x, ap.z - bp.z) < H * 1.5) { chat.phase = 'talk'; chat.lines = buildLines(A, B, chat.kind); if (chat.kind === 'fight') { setMood(A, 'angry', 90); setMood(B, 'angry', 90); } chat.next = t + 0.3; A.waveStart = t; }
    else endChat(t, 10);
    return;
  }
  faceTo(A, Math.atan2(bp.x - ap.x, bp.z - ap.z), dt);
  if (t < chat.next) return;
  if (chat.i >= chat.lines.length) return endChat(t, 40, true);
  const [who, text] = chat.lines[chat.i++], other = who === A ? B : A, dur = Math.max(2.4, text.length * 0.065 + 1);
  say(who, text, dur, true); if (chat.kind !== 'fight') other.nodStart = t; if (chat.kind === 'fight' || (who.p.talk > 2 && Math.random() < 0.4)) who.waveStart = t;
  chat.next = t + dur + 0.5;
}

// ---------- Sentuhan ----------
const ray = new THREE.Raycaster();
const ndc = (e) => new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
function floorPoint(e) { ray.setFromCamera(ndc(e), camera); const h = ray.intersectObject(floorMesh); return h.length ? h[0].point : null; }
function pickChar(e) {
  ray.setFromCamera(ndc(e), camera); let best = null, bd = 1e9;
  for (const c of chars) { const h = ray.intersectObject(c.mesh, true); if (h.length && h[0].distance < bd) { bd = h[0].distance; best = c; } }
  return best;
}
let downAt = null, pressing = false, downChar = null;
function setPtr(e) { ptr.x = (e.clientX / innerWidth) * 2 - 1; ptr.y = (e.clientY / innerHeight) * 2 - 1; ptr.last = clock.elapsedTime; if (selected) selected.auto.lastTouch = clock.elapsedTime; }
const dom = renderer.domElement;
dom.addEventListener('pointerdown', (e) => {
  if (!e.isPrimary) { pressing = false; downAt = null; return; }
  setPtr(e); downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; pressing = true; downChar = pickChar(e);
  if (!downChar && followBox.checked) { const p = floorPoint(e); if (p) walkTo(selected, p, true, false); }
});
dom.addEventListener('pointermove', (e) => {
  if (!e.isPrimary) return; setPtr(e);
  if (pressing && !downChar && followBox.checked) { const p = floorPoint(e); if (p) walkTo(selected, p, true, true); }
});
function release(e, cancelled) {
  const w = downAt; pressing = false; downAt = null;
  if (cancelled || !w) return;
  if (Math.hypot(e.clientX - w.x, e.clientY - w.y) > 10 || performance.now() - w.t > 400) return;
  if (downChar) { selected = downChar; flash('Mengendalikan: ' + selected.name, 2000); greet(selected); return; }
  if (!followBox.checked) { const p = floorPoint(e); if (p) walkTo(selected, p, false, false); }
}
dom.addEventListener('pointerup', (e) => release(e, false));
dom.addEventListener('pointercancel', (e) => release(e, true));
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- Mulut ----------
const VOW = ['あ', 'い', 'う', 'え', 'お'];
function updateMouth(c, t, dt) {
  const tgt = [0, 0, 0, 0, 0], sp = c.speech;
  if (c.sl.yawn > 0.01) tgt[0] = c.sl.yawn;
  else if (c.act.chew > 0.01) tgt[0] = c.act.chew;
  else if (t < sp.until) {
    if (t > sp.next) { sp.next = t + 0.07 + Math.random() * 0.09; sp.v = Math.floor(Math.random() * 5); sp.amp = Math.random() < 0.2 ? 0.1 : 0.45 + Math.random() * 0.5; }
    tgt[sp.v || 0] = sp.amp || 0;
  }
  const k = 1 - Math.exp(-20 * dt);
  for (let i = 0; i < 5; i++) { c.mouth[i] += (tgt[i] - c.mouth[i]) * k; const idx = c.morph[VOW[i]]; if (idx !== undefined) c.mesh.morphTargetInfluences[idx] = c.mouth[i]; }
}

// ---------- Simpan karakter di browser (IndexedDB): kunci "nama/namafile" ----------
const DB_NAME = 'mmd-room', STORE = 'files';
const dbOpen = () => new Promise((res, rej) => { const r = indexedDB.open(DB_NAME, 1); r.onupgradeneeded = () => r.result.createObjectStore(STORE); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function dbPut(key, blob) { const db = await dbOpen(); return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).put(blob, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function dbAll() { const db = await dbOpen(); return new Promise((res, rej) => { const st = db.transaction(STORE).objectStore(STORE), k = st.getAllKeys(), v = st.getAll(); v.onsuccess = () => res({ keys: k.result, vals: v.result }); v.onerror = () => rej(v.error); }); }
async function dbClear() { const db = await dbOpen(); return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).clear(); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }

let staged = new Map();
$('files').addEventListener('change', (ev) => {
  for (const f of ev.target.files) staged.set(f.name.toLowerCase(), f);
  ev.target.value = '';
  msg.textContent = staged.size + ' file terpilih' + ([...staged.keys()].some(k => k.endsWith('.pmx')) ? ' (pmx sudah ada)' : ' (pmx belum ada)') + '. Tambah dari folder lain, atau tekan "Tambah karakter".';
});
$('go').onclick = async () => {
  const name = $('cname').value.trim() || 'Karakter';
  if (![...staged.keys()].some(k => k.endsWith('.pmx'))) { msg.textContent = 'Pilih dulu file .pmx untuk ' + name + '.'; return; }
  const files = staged; staged = new Map();
  for (const [fn, blob] of files) dbPut(name + '/' + fn, blob).catch(() => {});
  await addChar(name, files);
};
$('clear').onclick = async () => { await dbClear().catch(() => {}); [...chars].forEach(removeChar); msg.textContent = 'Semua karakter tersimpan dihapus.'; };
$('tg').onclick = () => { const u = $('ui'); u.style.display = u.style.display === 'none' ? 'flex' : 'none'; };

(async () => {   // saat dibuka: muat semua karakter tersimpan (file lama tanpa nama = Xavier)
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    const { keys, vals } = await dbAll(), groups = {};
    keys.forEach((k, i) => { const ks = String(k), j = ks.indexOf('/'); const n = j < 0 ? 'Xavier' : ks.slice(0, j), fn = j < 0 ? ks : ks.slice(j + 1); (groups[n] = groups[n] || new Map()).set(fn, vals[i]); });
    for (const n in groups) if ([...groups[n].keys()].some(k => k.endsWith('.pmx'))) await addChar(n, groups[n]);
  } catch (e) { console.warn('Tidak bisa membaca penyimpanan', e); }
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

let statT = 0;
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  for (const c of chars) {
    if (idleBox.checked) idle(c, t, dt);
    lifeUpdate(c, t, dt); updateAuto(c, t, dt); updateWalk(c, dt); sleepyUpdate(c, t); sleepyApply(c); moodApply(c, t, dt); updateMouth(c, t, dt);
  }
  chatUpdate(t, dt);
  shrink(foodMesh, Math.min(...chars.map(c => c.life.foodS), 1)); shrink(glassMesh, Math.min(...chars.map(c => c.life.waterS), 1));
  helper.update(dt);
  for (const c of chars) updateBubble(c, t);
  if (t > statT) { statT = t + 1; $('stat').innerHTML = chars.map(c => `${c === selected ? '▶ ' : ''}${c.name}: lapar ${Math.round(c.needs.hunger)} · haus ${Math.round(c.needs.thirst)} · tenaga ${Math.round(c.needs.energy)} · ${c.life.state} · ${c.mood.type}`).join('<br>') + (chars.length > 1 ? '<br>❤ ' + chars[0].name + '–' + chars[1].name + ': ' + getRel(chars[0], chars[1]) : ''); }
  camUpdate(dt); controls.update(); renderer.render(scene, camera);
}
tick();
