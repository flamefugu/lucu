  if (kind === 'fight') return [t(A, 'fightStart', B), t(B, 'fightReply', A), t(A, 'fight2', B), t(B, 'fightReply', A), t(A, 'fightEnd', B)];
  if (kind === 'comfort') return [t(A, 'comfortStart', B), t(B, 'sadReply', A), t(A, 'comfort', B), t(B, 'thanks', A), t(A, 'comfortEnd', B)];
  if (kind === 'debate') return dLines(A, B, chat.out);
  if (kind === 'reconcile') return chat.ok ? [t(A, 'apologize', B), t(B, 'forgive', A), t(A, 'relieved', B)] : [t(A, 'apologize', B), t(B, 'refuse', A), t(A, 'idleSad')];
  if (A.p.scare && Math.random() < 0.5) return horrorLines(A, B);
  if (Math.random() < 0.75) {
    const rm = roomIdx(B.mesh.position.x), pool = TOPICS.umum.concat(rm === 2 ? TOPICS.dapur : rm === 1 ? TOPICS.tamu : []);
    const TL = topicLines(A, B, pool);
    TL.push([A, T(A, 'bye', B)]); return TL;
  }
  const L = [[A, T(A, 'chatStart', B)], [B, B.needs.energy < 40 ? T(B, 'sleepyReply', A) : T(B, 'reply', A)], [A, T(A, 'chat', B)], [B, T(B, 'reply2', A)]];
  if (Math.random() < 0.6) L.push([A, T(A, 'chat', B)], [B, T(B, 'reply', A)]);
  L.push([A, T(A, 'bye', B)]); return L;
}
// ---------- Hubungan & suasana hati ----------
const rels = {}, rk = (a, b) => [a.name, b.name].sort().join('|');
try { Object.assign(rels, JSON.parse(localStorage.getItem('mmd-rels') || '{}')); } catch (e) {}
const getRel = (a, b) => rels[rk(a, b)] ?? 20;
const REL_T = [[-50, 'Bermusuhan', '💔', '#ff5d5d'], [-15, 'Renggang', '😠', '#ff9a5d'], [15, 'Biasa', '😐', '#b0b6c3'], [40, 'Kenal', '🙂', '#7fd1ae'], [65, 'Teman', '😊', '#4cc9f0'], [85, 'Dekat', '💗', '#ff7fb0'], [101, 'Sahabat', '💞', '#ff5fa2']];
const relTier = (v) => REL_T.find(x => v < x[0]) || REL_T[REL_T.length - 1];
function addRel(a, b, d) {
  const old = getRel(a, b), nv = Math.max(-100, Math.min(100, old + d)); rels[rk(a, b)] = nv;
  if (Math.abs(nv - old) >= 2) { const until = clock.elapsedTime + 3, tx = (nv > old ? '💗 +' : '💔 ') + Math.round(nv - old); a.pulse = { until, text: tx + ' ' + b.name }; b.pulse = { until, text: tx + ' ' + a.name }; }
  try { localStorage.setItem('mmd-rels', JSON.stringify(rels)); } catch (e) {}
}
const ICON = { angry: ' 💢', sad: ' 💧', happy: ' 💕', calm: '' };
function setMood(c, type, secs) { c.mood.type = type; c.mood.until = clock.elapsedTime + secs; c.bubble.dataset.n = c.name + ICON[type]; }
function retreat(c) {   // pergi (cepat) ke kamarnya sendiri
  for (let i = 0; i < 10; i++) { const x = roomCx(c.home) + (Math.random() * 2 - 1) * (RW / 2 - H * 0.8), z = (Math.random() * 2 - 1) * (WZ - H * 0.8);
    if (!blocked(x, z)) { c.auto.lastTouch = -99; walkTo(c, { x, z }, true, true); return; } }
}
function pickKind(A, B) {
  const r = getRel(A, B), R = Math.random(), up = (c) => c.mood.type === 'angry' || c.mood.type === 'sad';
  if (up(A)) return A.mood.type === 'angry' && R > 0.35 + A.p.kind * 0.5 ? 'fight' : 'reconcile';
  if (B.mood.type === 'sad') return R < 0.4 + A.p.kind * 0.5 ? 'comfort' : '';
  if (B.mood.type === 'angry') return R < 0.3 + A.p.kind * 0.6 ? 'reconcile' : '';
  return R < A.p.temper * (0.5 - r / 200) ? 'fight' : Math.random() < 0.2 ? 'debate' : 'chat';
}
const MOOD_MORPH = { angry: ['怒り'], sad: ['悲しい', '困る'], happy: ['にこり', '笑い'] };
function moodApply(c, t, dt) {
  const m = c.mood, mk = c.mk, k = 1 - Math.exp(-4 * dt);
  if (m.type !== 'calm' && t > m.until) setMood(c, 'calm', 0);
  for (const key in mk) { mk[key] += ((m.type === key ? 1 : 0) - mk[key]) * k;
    const idx = MOOD_MORPH[key].map(n => c.morph[n]).find(i => i !== undefined); if (idx !== undefined) c.mesh.morphTargetInfluences[idx] = mk[key] * 0.85; }
  const { upper, neck, head } = c.bones, A = mk.angry, S = mk.sad, Hp = mk.happy, g = 1 - Math.min(1, c.life.lie * 3);
  if (upper) { upper.rotation.x += (0.08 * A + 0.1 * S + Math.sin(t * 3) * 0.03 * Hp) * g; upper.rotation.z += Math.sin(t * 28) * 0.025 * A * g; }
  if (neck) neck.rotation.x += 0.15 * S * g;
  if (head) { head.rotation.x += (0.12 * A + 0.35 * S) * g; head.rotation.z += Math.sin(t * 2.2) * 0.06 * Hp * g; head.rotation.y += Math.sin(t * 25) * 0.03 * A * g; }
}
function camUpdate(dt) {
  if (selected && selected.level !== lastSelLv) { lastSelLv = selected.level; viewLv = lastSelLv; }
  upG.visible = viewLv === 1;
  if (selected !== lastSelCam) { lastSelCam = selected; camManual = false; }
  const portrait = camera.aspect < 1.2; roomNav.style.display = portrait ? 'flex' : 'none';
  if (portrait) [...roomNav.children].forEach(b => { b.style.background = +b.dataset.r === camRoom && b.dataset.r >= 0 ? 'rgba(122,162,255,.7)' : b.dataset.r < 0 && !camManual ? 'rgba(122,162,255,.7)' : 'rgba(255,255,255,.14)'; });
  if (!camManual && selected && selected.mesh) { const x = selected.mesh.position.x, i = roomIdx(x); if (i !== camRoom && Math.abs(x - roomCx(camRoom)) > RW / 2 + 8) camRoom = i; }
  const want = camera.aspect < 1.2 ? roomCx(camRoom) : 0, d = (want - camShift) * (1 - Math.exp(-3 * dt));
  camShift += d; controls.target.x += d; camera.position.x += d;
  const dy = (viewLv * FY - camLift) * (1 - Math.exp(-4 * dt)); camLift += dy; controls.target.y += dy; camera.position.y += dy;
}
function chatUpdate(t, dt) {
  if (!chat.on) {
    if (!lifeBox.checked) return;
    if (t > nextNear) {   // dua karakter santai yang berdekatan langsung ngobrol, bukan cuma diam berkumpul
      nextNear = t + 2.5;
      const f = chars.filter(c => c.mesh && c.life.state === 'free' && !c.life.lock && !c.sl.active && !c.walk.active && t > c.socialCool);
      for (let i = 0; i < f.length; i++) for (let j = i + 1; j < f.length; j++) {
        const A = f[i], B = f[j];
        if (A.level === B.level && roomIdx(A.mesh.position.x) === roomIdx(B.mesh.position.x) && Math.hypot(A.mesh.position.x - B.mesh.position.x, A.mesh.position.z - B.mesh.position.z) < H * 3.5) {
          nextNear = t + 5; if (Math.random() < 0.5) tryStartChat(t, A, B); else tryStartChat(t, B, A); return;
        }
      }
    }
    if (t > nextSocial) { nextSocial = t + 7 + Math.random() * 9; tryStartChat(t); }
    return;
  }
  const A = chat.a, B = chat.b;
  if (!A.mesh || !B.mesh || !lifeBox.checked) return endChat(t, 10);
  const ap = A.mesh.position, bp = B.mesh.position;
  faceTo(B, Math.atan2(ap.x - bp.x, ap.z - bp.z), dt);
  if (chat.phase === 'walk') {
    if (A.walk.active) return;
    if (Math.hypot(ap.x - bp.x, ap.z - bp.z) < H * 1.5) { chat.phase = 'talk'; chat.lines = buildLines(A, B, chat.kind); if (chat.kind === 'fight') { setMood(A, 'angry', 90); setMood(B, 'angry', 90); } chat.next = t + 0.3; A.waveStart = t; }
    else endChat(t, 10);
    return;
  }
  faceTo(A, Math.atan2(bp.x - ap.x, bp.z - ap.z), dt);
  if (t < chat.next) return;
  if (chat.i >= chat.lines.length) return endChat(t, 22, true);
  const [who, text] = chat.lines[chat.i++], other = who === A ? B : A, dur = Math.max(2.4, text.length * 0.065 + 1);
  if (chat.kind === 'chat' || chat.kind === 'debate') addRel(A, B, 0.25); else if (chat.kind === 'fight') addRel(A, B, -0.5);
  say(who, text, dur, true); if (chat.kind !== 'fight') other.nodStart = t; if (chat.kind === 'fight' || (who.p.talk > 2 && Math.random() < 0.4)) who.waveStart = t;
  chat.next = t + dur + 0.5;
}

// ---------- Sentuhan ----------
const ray = new THREE.Raycaster();
const ndc = (e) => new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
function floorPoint(e) { ray.setFromCamera(ndc(e), camera); if (selected && selected.level !== viewLv) { flash('Karakter ini ada di lantai lain. Pakai tombol 🪜 untuk naik/turun.', 2500); return null; } const h = ray.intersectObject(viewLv ? floorUp : floorMesh); return h.length ? h[0].point : null; }
function pickChar(e) {
  ray.setFromCamera(ndc(e), camera); let best = null, bd = 1e9;
  for (const c of chars) { const h = ray.intersectObject(c.mesh, true); if (h.length && h[0].distance < bd) { bd = h[0].distance; best = c; } }
  return best;
}
let downAt = null, pressing = false, downChar = null;
function setPtr(e) { ptr.x = (e.clientX / innerWidth) * 2 - 1; ptr.y = (e.clientY / innerHeight) * 2 - 1; ptr.last = clock.elapsedTime; if (selected) selected.auto.lastTouch = clock.elapsedTime; }
const dom = renderer.domElement;
dom.addEventListener('pointerdown', (e) => {
  if (!e.isPrimary) { pressing = false; downAt = null; return; }
  setPtr(e); downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; pressing = true; downChar = pickChar(e);
  if (!downChar && manualBox.checked && followBox.checked) { const p = floorPoint(e); if (p) walkTo(selected, p, true, false); }
});
dom.addEventListener('pointermove', (e) => {
  if (!e.isPrimary) return; setPtr(e);
  if (pressing && !downChar && manualBox.checked && followBox.checked) { const p = floorPoint(e); if (p) walkTo(selected, p, true, true); }
});
function release(e, cancelled) {
  const w = downAt; pressing = false; downAt = null;
  if (cancelled || !w) return;
  if (Math.hypot(e.clientX - w.x, e.clientY - w.y) > 10 || performance.now() - w.t > 400) return;
  if (downChar) { selected = downChar; flash((manualBox.checked ? 'Mengendalikan: ' : 'Mengamati: ') + selected.name, 2000); greet(selected); return; }
  if (manualBox.checked && !followBox.checked) { const p = floorPoint(e); if (p) walkTo(selected, p, false, false); }
}
dom.addEventListener('pointerup', (e) => release(e, false));
dom.addEventListener('pointercancel', (e) => release(e, true));
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- Mulut ----------
const VOW = ['あ', 'い', 'う', 'え', 'お'];
function updateMouth(c, t, dt) {
  const tgt = [0, 0, 0, 0, 0], sp = c.speech;
  if (c.sl.yawn > 0.01) tgt[0] = c.sl.yawn;
  else if (c.act.chew > 0.01) tgt[0] = c.act.chew;
  else if (t < sp.until) {
    if (t > sp.next) { sp.next = t + 0.07 + Math.random() * 0.09; sp.v = Math.floor(Math.random() * 5); sp.amp = Math.random() < 0.2 ? 0.1 : 0.45 + Math.random() * 0.5; }
    tgt[sp.v || 0] = sp.amp || 0;
  }
  const k = 1 - Math.exp(-20 * dt);
  for (let i = 0; i < 5; i++) { c.mouth[i] += (tgt[i] - c.mouth[i]) * k; const idx = c.morph[VOW[i]]; if (idx !== undefined) c.mesh.morphTargetInfluences[idx] = c.mouth[i]; }
}

// ---------- Simpan karakter di browser (IndexedDB): kunci "nama/namafile" ----------
const DB_NAME = 'mmd-room', STORE = 'files';
const dbOpen = () => new Promise((res, rej) => { const r = indexedDB.open(DB_NAME, 1); r.onupgradeneeded = () => r.result.createObjectStore(STORE); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function dbPut(key, blob) { const db = await dbOpen(); return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).put(blob, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function dbAll() { const db = await dbOpen(); return new Promise((res, rej) => { const st = db.transaction(STORE).objectStore(STORE), k = st.getAllKeys(), v = st.getAll(); v.onsuccess = () => res({ keys: k.result, vals: v.result }); v.onerror = () => rej(v.error); }); }
async function dbDelPrefix(pre) { const { keys } = await dbAll(), db = await dbOpen(); return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite'), st = tx.objectStore(STORE); keys.filter(k => String(k).startsWith(pre)).forEach(k => st.delete(k)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function dbClear() { const db = await dbOpen(); return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).clear(); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }

let staged = new Map();
$('files').addEventListener('change', (ev) => {
  for (const f of ev.target.files) staged.set(f.name.toLowerCase(), f);
  ev.target.value = '';
  msg.textContent = staged.size + ' file terpilih' + ([...staged.keys()].some(k => k.endsWith('.pmx')) ? ' (pmx sudah ada)' : ' (pmx belum ada)') + '. Tambah dari folder lain, atau tekan "Tambah karakter".';
});
$('go').onclick = async () => {
  const name = $('cname').value.trim() || 'Karakter';
  if (![...staged.keys()].some(k => k.endsWith('.pmx'))) { msg.textContent = 'Pilih dulu file .pmx untuk ' + name + '.'; return; }
  const files = staged; staged = new Map();
  for (const [fn, blob] of files) dbPut(name + '/' + fn, blob).catch(() => {});
  await addChar(name, files);
};
$('tvgo').onclick = async () => {
  if (![...staged.keys()].some(k => k.endsWith('.pmx'))) { msg.textContent = 'Pilih dulu file .pmx (dan .vmd untuk gerakan) untuk TV.'; return; }
  const name = $('cname').value.trim() || 'MMD', files = staged; staged = new Map(); await dbDelPrefix('__tv/' + name + '/').catch(() => {});
  for (const [fn, blob] of files) dbPut('__tv/' + name + '/' + fn, blob).catch(() => {});
  await loadTV(files, name);
};
$('tvch').onclick = () => { tvManual = clock.elapsedTime; setTV(tvCh + 1); flash('Acara TV: ' + tvName(), 2500); };
$('tvclr').onclick = async () => { await dbDelPrefix('__tv/').catch(() => {}); tvMMD.forEach(x => tvScene.remove(x.mesh)); tvMMD.length = 0; setTV(0); flash('MMD di TV dihapus.'); };
$('stairs').onclick = () => { if (selected) { selected.life.lock = false; startClimb(selected, 1 - selected.level); flash('Tangga ada di dapur (sisi depan).', 2500); } };
$('viewlv').onclick = () => { viewLv = 1 - viewLv; };
$('clear').onclick = async () => { await dbClear().catch(() => {}); [...chars].forEach(removeChar); msg.textContent = 'Semua karakter tersimpan dihapus.'; };
$('tg').onclick = () => { const u = $('ui'); u.style.display = u.style.display === 'none' ? 'flex' : 'none'; };

(async () => {   // saat dibuka: muat semua karakter tersimpan (file lama tanpa nama = Xavier)
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    const { keys, vals } = await dbAll(), groups = {};
    keys.forEach((k, i) => { const ks = String(k), j = ks.indexOf('/'); const n = j < 0 ? 'Xavier' : ks.slice(0, j), fn = j < 0 ? ks : ks.slice(j + 1); (groups[n] = groups[n] || new Map()).set(fn, vals[i]); });
    for (const n in groups) if ([...groups[n].keys()].some(k => k.endsWith('.pmx'))) { if (n === '__tv') { const sub = {}; for (const [fn, b] of groups[n]) { const j = fn.indexOf('/'), nm = j < 0 ? 'MMD' : fn.slice(0, j); (sub[nm] = sub[nm] || new Map()).set(j < 0 ? fn : fn.slice(j + 1), b); } for (const nm in sub) if ([...sub[nm].keys()].some(k => k.endsWith('.pmx'))) await loadTV(sub[nm], nm); } else await addChar(n, groups[n]); }
  } catch (e) { console.warn('Tidak bisa membaca penyimpanan', e); }
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

const esc = (x) => String(x).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
let relOpen = true, relHeadHtml = '', relBodyHtml = '';
function updateRelHud() {

  if (!s || !chars.length) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  const n = s.needs, wc = Math.round(Math.max(s.wc.pee, s.wc.poo));
  const head = `${relOpen ? '▾' : '▸'} 💞 Hubungan ${esc(s.name)}${ICON[s.mood.type]}<small>🍽 ${Math.round(n.hunger)} · 💧 ${Math.round(n.thirst)} · ⚡ ${Math.round(n.energy)} · 🚽 ${wc}</small>`;
  if (head !== relHeadHtml) { relHeadHtml = head; $('relhead').innerHTML = head; }
  const others = chars.filter(o => o !== s);
  const body = relOpen ? (others.length ? others.map(o => { const v = Math.round(getRel(s, o)), rt = relTier(v);
    return `<div class="rr" data-i="${chars.indexOf(o)}"><span class="nm">${esc(o.name)}</span><span class="bar"><i style="width:${(v + 100) / 2}%;background:${rt[3]}"></i></span><span class="lv">${rt[2]} ${rt[1]} (${v})</span></div>`; }).join('') : '<div class="lv">Belum ada karakter lain.</div>') : '';

$('relhead').onclick = () => { relOpen = !relOpen; updateRelHud(); };
$('relbody').onclick = (e) => { const r = e.target.closest('.rr'), o = r && chars[+r.dataset.i]; if (o) { selected = o; flash('Mengendalikan: ' + o.name, 2000); updateRelHud(); } };
let statT = 0;
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  for (const c of chars) {
    lvlNow = c.level; climbUpdate(c);
    if (idleBox.checked) idle(c, t, dt);
    lifeUpdate(c, t, dt); updateAuto(c, t, dt); separate(c, dt); updateWalk(c, dt); sleepyUpdate(c, t); sleepyApply(c); sitApply(c, dt); moodApply(c, t, dt); propUpdate(c); updateMouth(c, t, dt);
    c.lvlY = c.climb && c.climb.ph === 1 ? stairY(c.mesh.position.x) : c.level * FY; c.mesh.position.y += c.lvlY; c.shadow.position.y += c.lvlY;

  tvUpdate(dt, t); camUpdate(dt); controls.update(); renderer.render(scene, camera);
}
tick();
